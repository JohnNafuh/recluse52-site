<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RECLUSE</title>
<link rel="stylesheet" href="style.css?v=13">
</head>

<body>

<nav class="nav">
  <a class="nav-logo" href="index.html">RECLUSE</a>
  <div class="nav-links">
    <a href="shop.html">SHOP</a>
    <a href="cart.html">CART (<span data-cart-count>0</span>)</a>
  </div>
</nav>

<main class="wrap product" id="product">
  <div class="product-layout">

    <div class="product-intro">
      <a class="back-link" href="shop.html">
        <svg width="20" height="14" viewBox="0 0 20 14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M19 7H1M7 1L1 7l6 6"/></svg>
        Back to shop
      </a>
      <div class="product-title-row">
        <h1 class="product-title" id="name"></h1>
        <span class="badge" id="drop"></span>
      </div>
      <p class="product-desc" id="desc"></p>
    </div>

    <div class="gallery">
      <img id="photo" alt="">
      <div class="counter" id="counter" hidden>
        <button type="button" id="prevPhoto" aria-label="Previous photo">‹</button>
        <span id="photoCount">1 / 1</span>
        <button type="button" id="nextPhoto" aria-label="Next photo">›</button>
      </div>
    </div>

    <div class="panel">
      <div class="option" id="colorOption" hidden>
        <div class="option-head"><h2>Color</h2><span id="colorName"></span></div>
        <div class="swatches" id="swatches"></div>
      </div>
      <div class="option">
        <div class="option-head"><h2>Size</h2><span id="sizeName"></span></div>
        <div class="sizes" id="sizes"></div>
      </div>
    </div>

    <div class="buy-bar">
      <div class="price-block">
        <span class="price" id="price"></span>
        <span class="price-note">Limited · no restock</span>
      </div>
      <button type="button" class="save-btn" id="shareBtn" aria-label="Share this product">
        <svg width="18" height="20" viewBox="0 0 18 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M9 13V1M4 6l5-5 5 5"/><path d="M1 11v8h16v-8"/></svg>
      </button>
      <button type="button" class="add-btn" id="addBtn">Add to cart</button>
    </div>

  </div>
</main>

<script src="products.js?v=8"></script>
<script src="cart.js?v=2"></script>
<script>
const id = new URLSearchParams(location.search).get("id");
const product = getProduct(id);

if (!product) {
  document.getElementById("product").innerHTML = `
    <div class="cart-empty">
      <p>This product isn't available.</p>
      <a class="btn" href="shop.html">BACK TO SHOP</a>
    </div>`;
} else {
  let photo = 0;
  let size = product.sizes.includes("M") ? "M" : product.sizes[0];
  let color = product.colors.length ? product.colors[0].name : "";

  document.title = "RECLUSE | " + product.name;
  document.getElementById("name").textContent = product.name;
  document.getElementById("drop").textContent = product.drop;
  document.getElementById("desc").textContent = product.desc;
  document.getElementById("price").textContent = formatPrice(product.price);

  const addBtn = document.getElementById("addBtn");
  const resetAdd = () => { addBtn.textContent = "Add to cart"; };

  /* photos: counter only shows with 2+ photos */
  const photoEl = document.getElementById("photo");
  function showPhoto() {
    photoEl.src = product.images[photo];
    photoEl.alt = product.name + " photo " + (photo + 1);
    document.getElementById("photoCount").textContent = (photo + 1) + " / " + product.images.length;
  }
  if (product.images.length > 1) {
    document.getElementById("counter").hidden = false;
    document.getElementById("prevPhoto").onclick = () => { photo = (photo - 1 + product.images.length) % product.images.length; showPhoto(); };
    document.getElementById("nextPhoto").onclick = () => { photo = (photo + 1) % product.images.length; showPhoto(); };
  }
  showPhoto();

  /* colors: option only shows with 2+ colors */
  function renderColors() {
    document.getElementById("colorName").textContent = color;
    document.getElementById("swatches").innerHTML = product.colors.map(c => `
      <button type="button" class="swatch" aria-label="${c.name}" aria-pressed="${c.name === color}" data-color="${c.name}">
        <span style="background:${c.hex}"></span>
      </button>`).join("");
  }
  if (product.colors.length > 1) {
    document.getElementById("colorOption").hidden = false;
    document.getElementById("swatches").onclick = e => {
      const btn = e.target.closest("[data-color]");
      if (!btn) return;
      color = btn.dataset.color;
      renderColors();
      resetAdd();
    };
    renderColors();
  }

  /* sizes */
  function renderSizes() {
    document.getElementById("sizeName").textContent = size;
    document.getElementById("sizes").innerHTML = product.sizes.map(s => `
      <button type="button" class="size" aria-pressed="${s === size}" data-size="${s}">${s}</button>`).join("");
  }
  document.getElementById("sizes").onclick = e => {
    const btn = e.target.closest("[data-size]");
    if (!btn) return;
    size = btn.dataset.size;
    renderSizes();
    resetAdd();
  };
  renderSizes();

  /* add to cart */
  addBtn.onclick = () => {
    addToCart(product.id, size, color);
    addBtn.textContent = "Added ✓";
  };

  /* share: phone share sheet, or copy the link on desktop */
  document.getElementById("shareBtn").onclick = async () => {
    const data = { title: product.name, text: product.name + " — RECLUSE", url: location.href };
    try {
      if (navigator.share) {
        await navigator.share(data);
      } else {
        await navigator.clipboard.writeText(location.href);
        addBtn.textContent = "Link copied";
        setTimeout(resetAdd, 1500);
      }
    } catch (e) { /* share cancelled */ }
  };
}
</script>

</body>
</html>
