<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RECLUSE | CART</title>
<link rel="stylesheet" href="style.css?v=3">
</head>

<body>

<nav class="nav">
  <a class="nav-logo" href="index.html">RECLUSE</a>
  <div class="nav-links">
    <a href="shop.html">SHOP</a>
  </div>
</nav>

<main class="wrap" style="max-width: 720px">

  <div class="section-head" style="padding-top: 16px">
    <h2>YOUR CART</h2>
  </div>

  <div class="cart-list" id="cartList"></div>

  <div id="checkout">
    <div class="cart-total">
      <span>Total</span>
      <span id="cartTotal"></span>
    </div>

    <div class="form">
      <div class="field">
        <label for="name">Full name</label>
        <input id="name" autocomplete="name">
      </div>
      <div class="field">
        <label for="phone">Phone number</label>
        <input id="phone" type="tel" autocomplete="tel">
      </div>
      <div class="field">
        <label for="address">Delivery address</label>
        <textarea id="address" rows="3" autocomplete="street-address"></textarea>
      </div>

      <p id="formError" role="alert" style="margin: 0; color: #b42318" hidden></p>

      <button type="button" class="btn" id="checkoutBtn" style="width: 100%">CHECKOUT ON WHATSAPP</button>
      <p style="margin: 0; font-size: 14px; color: var(--muted); text-align: center">
        Your order opens in WhatsApp. Send the message to confirm it.
      </p>
    </div>
  </div>

</main>

<footer class="footer">
  <span>© RECLUSE</span>
  <div class="footer-links">
    <a href="#">INSTAGRAM</a>
    <a href="https://wa.me/2347038547668" target="_blank" rel="noopener">WHATSAPP</a>
  </div>
</footer>

<script src="products.js?v=2"></script>
<script src="cart.js?v=2"></script>
<script>
const WHATSAPP_NUMBER = "2347038547668";

const listEl = document.getElementById("cartList");
const checkoutEl = document.getElementById("checkout");

function renderCart() {
  const cart = readCart();

  if (cart.length === 0) {
    listEl.innerHTML = `
      <div class="cart-empty">
        <p>Your cart is empty.</p>
        <a class="btn" href="shop.html">SHOP NOW</a>
      </div>`;
    checkoutEl.hidden = true;
    return;
  }

  checkoutEl.hidden = false;

  listEl.innerHTML = cart.map((item, i) => {
    const p = PRODUCTS[item.id];
    const details = "Size " + item.size + (item.color ? " · " + item.color : "");
    return `
      <div class="cart-item">
        <img src="${p.images[0]}" alt="${p.name}">
        <div class="cart-info">
          <span class="cart-name">${p.name}</span>
          <span class="cart-meta">${details}</span>
          <span class="cart-meta">${formatPrice(p.price * item.qty)}</span>
          <div class="qty">
            <button type="button" aria-label="One less" data-qty="${i}" data-change="-1">−</button>
            <span>${item.qty}</span>
            <button type="button" aria-label="One more" data-qty="${i}" data-change="1">+</button>
          </div>
        </div>
        <button type="button" class="remove-btn" data-remove="${i}">Remove</button>
      </div>`;
  }).join("");

  document.getElementById("cartTotal").textContent = formatPrice(cartTotal());
}

// quantity and remove buttons
listEl.onclick = e => {
  const qtyBtn = e.target.closest("[data-qty]");
  const removeBtn = e.target.closest("[data-remove]");
  if (qtyBtn) {
    const i = Number(qtyBtn.dataset.qty);
    setQty(i, readCart()[i].qty + Number(qtyBtn.dataset.change));
  } else if (removeBtn) {
    removeFromCart(Number(removeBtn.dataset.remove));
  } else {
    return;
  }
  renderCart();
};

// WhatsApp checkout
document.getElementById("checkoutBtn").onclick = () => {
  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const address = document.getElementById("address").value.trim();
  const errorEl = document.getElementById("formError");

  if (!name || !phone || !address) {
    errorEl.textContent = "Add your name, phone number and delivery address to check out.";
    errorEl.hidden = false;
    return;
  }
  errorEl.hidden = true;

  let message =
    "🛒 RECLUSE ORDER\n\n" +
    "Name: " + name + "\n" +
    "Phone: " + phone + "\n" +
    "Address: " + address + "\n\n";

  readCart().forEach((item, i) => {
    const p = PRODUCTS[item.id];
    const details = item.size + (item.color ? ", " + item.color : "");
    message += `${i + 1}. ${p.name} (${details}) x${item.qty} - ${formatPrice(p.price * item.qty)}\n`;
  });

  message += "\nTOTAL: " + formatPrice(cartTotal());
  message += "\n\nI wish to place my order now";

  window.open("https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(message), "_blank");
};

renderCart();
</script>

</body>
</html>
