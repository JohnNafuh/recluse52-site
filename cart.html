<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RECLUSE | CART</title>
<link rel="stylesheet" href="style.css?v=11">
</head>

<body>

<nav class="nav">
  <a class="nav-logo" href="index.html">RECLUSE</a>
  <div class="nav-links">
    <a href="shop.html">SHOP</a>
  </div>
</nav>

<main class="wrap" id="cartPage" style="max-width: 720px">

  <div class="section-head" style="padding-top: 16px">
    <h2>YOUR CART</h2>
  </div>

  <div class="cart-list" id="cartList"></div>

  <div id="checkout">
    <div class="option" style="padding-top: 20px">
      <div class="option-head"><h2>Delivery</h2></div>
      <div class="delivery-options" id="deliveryOptions"></div>
    </div>

    <div class="totals">
      <div><span>Subtotal</span><span id="subtotal"></span></div>
      <div><span>Delivery</span><span id="deliveryFee">Choose an option</span></div>
    </div>
    <div class="cart-total">
      <span>Total</span>
      <span id="cartTotal"></span>
    </div>

    <div class="form">
      <div class="field">
        <label for="name">Full name</label>
        <input id="name" autocomplete="name">
      </div>
      <div class="field">
        <label for="email">Email (for your receipt)</label>
        <input id="email" type="email" autocomplete="email" inputmode="email">
      </div>
      <div class="field">
        <label for="phone">Phone number</label>
        <input id="phone" type="tel" autocomplete="tel">
      </div>
      <div class="field" id="addressField">
        <label for="address">Delivery address</label>
        <textarea id="address" rows="3" autocomplete="street-address"></textarea>
      </div>
      <p id="pickupNote" class="cart-meta" style="margin: 0" hidden>
        We'll contact you on your phone number with pickup details once your order is in.
      </p>

      <p id="formError" role="alert" style="margin: 0; color: #b42318" hidden></p>

      <button type="button" class="btn" id="payBtn" style="width: 100%">PAY</button>
      <p style="margin: 0; font-size: 14px; color: var(--muted); text-align: center">
        Pay by card, transfer, bank or USSD. Secured by Paystack.
      </p>
    </div>
  </div>

</main>

<footer class="footer">
  <span>© RECLUSE</span>
  <div class="footer-links">
    <a href="#">INSTAGRAM</a>
    <a href="https://wa.me/2347038547668" target="_blank" rel="noopener">WHATSAPP</a>
  </div>
</footer>

<script src="https://js.paystack.co/v2/inline.js"></script>
<script src="products.js?v=7"></script>
<script src="cart.js?v=2"></script>
<script>
/* Public key only. Never put the secret key (sk_...) in this file.
   Swap to pk_live_... when Paystack approves the business. */
const PAYSTACK_PUBLIC_KEY = "pk_test_5782603cdecee08c6aff3139313ced1d8cbf4925";
const WHATSAPP_NUMBER = "2347038547668";
// every paid order is emailed to you through this Formspree form
const ORDER_EMAIL_ENDPOINT = "https://formspree.io/f/mwlpznkk";

// delivery options: edit prices here
const DELIVERY = [
  { id: "abuja", label: "Within Abuja", fee: 2000 },
  { id: "outside", label: "Outside Abuja", fee: 4000 },
  { id: "pickup", label: "Pickup", fee: 0 }
];
let delivery = null; // chosen option

const listEl = document.getElementById("cartList");
const checkoutEl = document.getElementById("checkout");
const payBtn = document.getElementById("payBtn");
const errorEl = document.getElementById("formError");

function showError(msg) {
  errorEl.textContent = msg;
  errorEl.hidden = false;
}

function renderCart() {
  const cart = readCart();

  if (cart.length === 0) {
    listEl.innerHTML = `
      <div class="cart-empty">
        <p>Your cart is empty.</p>
        <a class="btn" href="shop.html">SHOP NOW</a>
      </div>`;
    checkoutEl.hidden = true;
    return;
  }

  checkoutEl.hidden = false;

  listEl.innerHTML = cart.map((item, i) => {
    const p = PRODUCTS[item.id];
    const details = "Size " + item.size + (item.color ? " · " + item.color : "");
    return `
      <div class="cart-item">
        <img src="${p.images[0]}" alt="${p.name}">
        <div class="cart-info">
          <span class="cart-name">${p.name}</span>
          <span class="cart-meta">${details}</span>
          <span class="cart-meta">${formatPrice(p.price * item.qty)}</span>
          <div class="qty">
            <button type="button" aria-label="One less" data-qty="${i}" data-change="-1">−</button>
            <span>${item.qty}</span>
            <button type="button" aria-label="One more" data-qty="${i}" data-change="1">+</button>
          </div>
        </div>
        <button type="button" class="remove-btn" data-remove="${i}">Remove</button>
      </div>`;
  }).join("");

  renderTotals();
}

function orderTotal() {
  return cartTotal() + (delivery ? delivery.fee : 0);
}

function renderDelivery() {
  document.getElementById("deliveryOptions").innerHTML = DELIVERY.map(d => `
    <button type="button" class="delivery-option" data-delivery="${d.id}"
            aria-pressed="${delivery && delivery.id === d.id}">
      <span>${d.label}</span>
      <span>${d.fee ? formatPrice(d.fee) : "Free"}</span>
    </button>`).join("");

  const isPickup = delivery && delivery.id === "pickup";
  document.getElementById("addressField").hidden = isPickup;
  document.getElementById("pickupNote").hidden = !isPickup;
}

function renderTotals() {
  document.getElementById("subtotal").textContent = formatPrice(cartTotal());
  document.getElementById("deliveryFee").textContent =
    delivery ? (delivery.fee ? formatPrice(delivery.fee) : "Free") : "Choose an option";
  const total = formatPrice(orderTotal());
  document.getElementById("cartTotal").textContent = total;
  payBtn.textContent = "PAY " + total;
}

document.getElementById("deliveryOptions").onclick = e => {
  const btn = e.target.closest("[data-delivery]");
  if (!btn) return;
  delivery = DELIVERY.find(d => d.id === btn.dataset.delivery);
  errorEl.hidden = true;
  renderDelivery();
  renderTotals();
};

// quantity and remove buttons
listEl.onclick = e => {
  const qtyBtn = e.target.closest("[data-qty]");
  const removeBtn = e.target.closest("[data-remove]");
  if (qtyBtn) {
    const i = Number(qtyBtn.dataset.qty);
    setQty(i, readCart()[i].qty + Number(qtyBtn.dataset.change));
  } else if (removeBtn) {
    removeFromCart(Number(removeBtn.dataset.remove));
  } else {
    return;
  }
  renderCart();
};

// one line per item, used in Paystack and the receipt
function orderLines() {
  return readCart().map(item => {
    const p = PRODUCTS[item.id];
    const details = item.size + (item.color ? ", " + item.color : "");
    return `${p.name} (${details}) x${item.qty} - ${formatPrice(p.price * item.qty)}`;
  });
}

// Paystack checkout: card or bank transfer
payBtn.onclick = () => {
  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const address = document.getElementById("address").value.trim();

  if (!delivery) {
    showError("Choose a delivery option: within Abuja, outside Abuja or pickup.");
    return;
  }
  const isPickup = delivery.id === "pickup";
  if (!name || !email || !phone || (!isPickup && !address)) {
    showError(isPickup
      ? "Add your name, email and phone number to pay."
      : "Add your name, email, phone number and delivery address to pay.");
    return;
  }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    showError("That email doesn't look right. Check it and try again.");
    return;
  }
  if (typeof PaystackPop === "undefined") {
    showError("Payment couldn't load. Check your connection and refresh the page.");
    return;
  }
  errorEl.hidden = true;

  const total = orderTotal();
  const lines = orderLines();
  const deliveryLine = "Delivery: " + delivery.label + " - " + (delivery.fee ? formatPrice(delivery.fee) : "Free");
  const reference = "RCL-" + Date.now();

  const nameParts = name.split(/\s+/);
  const popup = new PaystackPop();
  popup.newTransaction({
    key: PAYSTACK_PUBLIC_KEY,
    email: email,
    firstName: nameParts[0],
    lastName: nameParts.slice(1).join(" "),
    phone: phone,
    amount: total * 100, // Paystack counts in kobo
    currency: "NGN",
    reference: reference,
    metadata: {
      custom_fields: [
        { display_name: "Name", variable_name: "name", value: name },
        { display_name: "Phone", variable_name: "phone", value: phone },
        { display_name: "Delivery", variable_name: "delivery", value: deliveryLine },
        { display_name: "Address", variable_name: "address", value: isPickup ? "Pickup" : address },
        { display_name: "Items", variable_name: "items", value: lines.join(" | ") },
        { display_name: "Order total", variable_name: "order_total", value: formatPrice(total) }
      ]
    },
    onSuccess: transaction => {
      const order = {
        name, email, phone,
        address: isPickup ? "Pickup" : address,
        reference: transaction.reference || reference,
        lines, deliveryLine, total
      };
      emailOrder(order);
      showConfirmation(order);
    },
    onCancel: () => {
      showError("Payment cancelled. Your cart is still here when you're ready.");
    },
    onError: () => {
      showError("Something went wrong with the payment. Please try again.");
    }
  });
};

// sends the paid order to your email (Formspree)
function emailOrder(order) {
  fetch(ORDER_EMAIL_ENDPOINT, {
    method: "POST",
    keepalive: true, // still sends if the customer leaves the page
    headers: { "Content-Type": "application/json", "Accept": "application/json" },
    body: JSON.stringify({
      _subject: "New RECLUSE order " + order.reference + " - " + formatPrice(order.total),
      _replyto: order.email,
      Reference: order.reference,
      "Total paid": formatPrice(order.total),
      Name: order.name,
      Email: order.email,
      Phone: order.phone,
      Delivery: order.deliveryLine,
      Address: order.address,
      Items: order.lines.join("\n")
    })
  }).catch(() => { /* email failed: the order is still in Paystack */ });
}

// after a successful payment
function showConfirmation(order) {
  clearCart();

  const receipt =
    "RECLUSE PAYMENT RECEIPT\n\n" +
    "Name: " + order.name + "\n" +
    "Phone: " + order.phone + "\n" +
    "Address: " + order.address + "\n" +
    "Reference: " + order.reference + "\n" +
    "Total paid: " + formatPrice(order.total) + "\n\n" +
    order.lines.join("\n") + "\n" + order.deliveryLine;

  document.getElementById("cartPage").innerHTML = `
    <div class="section-head" style="padding-top: 16px">
      <h2>ORDER CONFIRMED</h2>
    </div>
    <p class="about-text" style="margin-bottom: 16px">
      Thank you, ${order.name.replace(/[<>&"]/g, "")}. Your payment went through and your order is in.
      A receipt has been sent to your email.
    </p>
    <div class="cart-list">
      ${order.lines.concat(order.deliveryLine).map(l => `<div class="cart-item"><span class="cart-meta">${l}</span></div>`).join("")}
    </div>
    <div class="cart-total"><span>Total paid</span><span>${formatPrice(order.total)}</span></div>
    <p class="cart-meta" style="margin: 0 0 24px">Reference: ${order.reference}</p>
    <div class="form">
      <a class="btn" style="width: 100%" target="_blank" rel="noopener"
         href="https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(receipt)}">SEND RECEIPT ON WHATSAPP</a>
      <a class="btn" style="width: 100%; background: var(--stone); color: var(--ink)" href="shop.html">CONTINUE SHOPPING</a>
    </div>`;
  window.scrollTo(0, 0);
}

renderDelivery();
renderCart();
</script>

</body>
</html>
