<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RECLUSE | EXTRAS</title>
<meta name="description" content="RECLUSE extras: wall frames and other pieces outside the clothing collection.">
<link rel="stylesheet" href="style.css?v=25">
<style>
.ex-hero { position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; min-height: clamp(220px, 42vw, 360px); padding: clamp(24px, 5vw, 56px) clamp(18px, 4vw, 48px); border-radius: var(--radius); background: #0e0e0e; color: #ffffff; }
.ex-hero::before { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at 70% 20%, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0) 60%); }
.ex-word { position: relative; margin: 0; font-family: var(--wide); font-weight: 400; font-size: min(15.5vw, 150px); line-height: 1; letter-spacing: 0.04em; color: transparent; -webkit-text-stroke: 1px rgba(255, 255, 255, 0.45); }
.ex-sub { position: relative; display: flex; justify-content: space-between; gap: 12px; margin: 16px 0 0; font-family: var(--wide); font-size: 9px; letter-spacing: 0.22em; color: rgba(255, 255, 255, 0.7); }

/* frames leaning on a picture ledge, sliding left without end */
.ledge { position: relative; margin-top: 0; padding-top: 36px; border-radius: var(--radius); background: radial-gradient(ellipse at 50% 0%, #f5f2eb 0%, #e2ddd3 100%); overflow: hidden; }
.ledge-row { position: relative; overflow: hidden; }
.ledge-row::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 18px; background: linear-gradient(#fcfbf8, #d6d1c6); box-shadow: 0 -1px 0 rgba(0, 0, 0, 0.08), 0 12px 16px -6px rgba(0, 0, 0, 0.28); }
.ledge-track { display: flex; align-items: flex-end; width: max-content; padding-bottom: 18px; animation: ledgeMove 60s linear infinite; will-change: transform; }
@keyframes ledgeMove { to { transform: translateX(calc(-1 * var(--set, 0px))); } }
.ledge:hover .ledge-track { animation-play-state: paused; }
.ledge-item { position: relative; z-index: 1; flex: 0 0 auto; display: block; width: clamp(72px, 20vw, 118px); margin-right: clamp(8px, 2vw, 20px); }
.ledge-item.w1 { width: clamp(88px, 24vw, 140px); }
.ledge-item.w2 { width: clamp(66px, 18vw, 104px); }
.ledge-item .frame { --fw: 4px; transform: rotate(var(--r, 0deg)); transform-origin: 50% 100%; transition: transform 0.35s ease; }
.ledge-item.r0 { --r: -1.2deg; } .ledge-item.r1 { --r: 0.6deg; } .ledge-item.r2 { --r: 1.3deg; } .ledge-item.r3 { --r: -0.5deg; }
.ledge-item:hover .frame, .ledge-item:active .frame { transform: rotate(0deg) translateY(-6px); }
@media (prefers-reduced-motion: reduce) { .ledge-track { animation: none; } .ledge-row { overflow-x: auto; } }

/* editorial grid */
.ex-grid { counter-reset: n; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px 10px; }
.ex-grid .card { counter-increment: n; transition: transform 0.35s ease; }
.ex-grid .card::before { content: counter(n, decimal-leading-zero); margin-bottom: 4px; font-family: var(--wide); font-size: 9px; letter-spacing: 0.22em; color: var(--muted); }
.ex-grid .card:nth-child(3n + 2) { margin-top: 30px; }
.ex-grid .card-meta { font-size: 11px; }
.ex-grid .frame { --fw: 4px; }
.ex-grid .card:hover { transform: translateY(-6px); }
@media (min-width: 900px) {
  .ex-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 36px 20px; }
  .ex-grid .card:nth-child(3n + 2) { margin-top: 0; }
  .ex-grid .card:nth-child(even) { margin-top: 38px; }
}

.ex-soon { margin-top: 56px; padding: 26px 18px; border: 1px dashed #bdbdba; border-radius: var(--radius); text-align: center; font-family: var(--wide); font-size: 10px; letter-spacing: 0.22em; color: var(--muted); }
</style>
</head>

<body>

<nav class="nav">
  <a class="nav-logo" href="index.html">RECLUSE</a>
  <div class="nav-links">
    <a href="shop.html">SHOP</a>
    <a href="cart.html">CART (<span data-cart-count>0</span>)</a>
  </div>
</nav>

<main class="wrap">

  <section class="section section-compact">
    <div class="ledge" aria-label="Frames on a ledge">
      <div class="ledge-row"><div class="ledge-track" id="ledge"></div></div>
    </div>
  </section>

  <section class="section section-compact" id="frames">
    <div class="section-head"><h2>ALL FRAMES</h2></div>
    <div class="ex-grid" data-category="frames"></div>
    <div class="ex-soon">MORE EXTRAS SOON</div>
  </section>

</main>

<footer class="footer">
  <span>© RECLUSE</span>
  <div class="footer-links">
    <a href="privacy.html">PRIVACY</a>
    <a href="terms.html">TERMS</a>
    <a href="#">INSTAGRAM</a>
    <a href="https://wa.me/2347038547668" target="_blank" rel="noopener">WHATSAPP</a>
  </div>
</footer>

<script src="products.js?v=21"></script>
<script src="cart.js?v=5"></script>
<script>
  const frames = listProducts("frames");

  // frames leaning on the ledge, repeated so the slide never runs out
  const ledge = document.getElementById("ledge");
  const setHtml = frames.map((p, i) =>
    `<a class="ledge-item w${i % 3} r${i % 4}" href="product.html?id=${p.id}" aria-label="${p.name}"><span class="frame"><img src="${p.images[0]}" alt="${p.name}" loading="lazy" draggable="false"></span></a>`).join("");
  ledge.innerHTML = setHtml;
  const setW = ledge.scrollWidth;                                   // width of one full set
  const copies = Math.ceil(ledge.parentElement.clientWidth / setW) + 1;
  ledge.innerHTML = setHtml.repeat(copies);
  ledge.style.setProperty("--set", setW + "px");
  ledge.style.animationDuration = Math.max(20, setW / 40) + "s";    // about 40px per second

  // numbered grid
  document.querySelectorAll("[data-category]").forEach(grid => {
    grid.innerHTML = listProducts(grid.dataset.category).map(productCard).join("");
  });

  // coming back from a product: return to the spot you left
  const nav = performance.getEntriesByType("navigation")[0];
  const savedY = Number(sessionStorage.getItem("extrasScroll") || 0);
  if (nav && nav.type === "back_forward" && savedY) { history.scrollRestoration = "manual"; window.scrollTo(0, savedY); }
  const saveY = () => sessionStorage.setItem("extrasScroll", String(window.scrollY));
  window.addEventListener("pagehide", saveY);
  document.addEventListener("click", e => { if (e.target.closest("a.card, a.ledge-item")) saveY(); });
</script>

</body>
</html>
